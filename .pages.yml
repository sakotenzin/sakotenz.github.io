#
#  .pages.yml
#  sakotenz.github.io
#
#  Created by Vitor Venturin on 09/11/2026.
#
#  Pages CMS config (https://pagescms.org): browser editor for posts, press cards, site settings,
#  the About page and media.
#  Edit at https://app.pagescms.org, pick this repo and the `main` branch. Every save is a commit.
#  Every front matter key must be declared here: on save, Pages CMS rewrites the front matter
#  from these fields only and drops anything else. Media values are full paths (/assets/img/x.jpg).
#

media:
  - name: images
    label: Images
    input: assets/img
    output: /assets/img
    categories: [image]
    rename: safe # no spaces: row.html splits media items on spaces
  - name: videos
    label: Videos
    input: assets/video
    output: /assets/video
    categories: [video]
    rename: safe

content:
  - name: posts
    label: Projects
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: false # hidden: built from the title on save, so a post never gets an empty slug (URL / would overwrite the home page)
    view:
      fields: [title, label]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: Big title on the project page.
      - name: page_title
        label: Browser tab title
        type: string
        description: Optional. Text in the browser tab.
      - name: label
        label: Label
        type: string
        description: Small line above the title, e.g. "OOH / PR".
      - name: subtitle
        label: Subtitle
        type: string
        description: Optional. Line under the title.
      - name: description
        label: Description (for Google / sharing)
        type: text
      - name: hidden
        label: Hide from home page
        type: boolean
        default: false
        description: The card leaves the home grid and Google stops indexing the page. The project is kept, and its link still works for previews.
      - name: card
        label: Home card
        type: object
        fields:
          - name: label
            label: Card label
            type: string
            description: Small text above the card, e.g. "OOH / 2023".
          - name: title
            label: Card title
            type: string
          - name: video
            label: Preview video
            type: file
            options:
              media: videos
            description: Looping MP4 (720p). Use either a video + poster, or an image.
          - name: poster
            label: Video poster image
            type: image
            options:
              media: images
          - name: image
            label: Card image
            type: image
            options:
              media: images
            description: Used when there is no video.
          - name: width
            label: Image width (px)
            type: number
          - name: height
            label: Image height (px)
            type: number
          - name: soon
            label: Show COMING SOON badge
            type: boolean
            default: false
      - name: body
        label: Page content
        type: code
        options:
          format: markdown
        description: >-
          Markdown. Keep the {% include ... %} lines and {: .xxx} lines as they are.
          Image row: {% include row.html media="a.jpg 1920x1280 | b.jpg 800x600" %}
          (bare filenames from Media > Images, with their size). Video: paste a YouTube or Vimeo link alone on its own line.

    actions:
      - name: new-project-from
        label: New project from this
        scope: entry
        workflow: new-project-from.yml
        ref: current
        confirm:
          title: New project from this one
          message: Copies this project (body, card, video, images) to a new project with the title below. Reload the Projects list after about a minute to see it.
          button: Create copy
        fields:
          - name: title
            label: Title of the new project
            type: text
            required: true
          - name: hidden
            label: Keep hidden from the home page until it is ready
            type: checkbox
            default: true

  - name: grid
    label: Home grid order
    type: file
    path: _data/grid.yml
    format: yaml
    fields:
      - name: projects
        label: Projects, top to bottom
        type: reference
        list: true
        options:
          collection: posts
          search: title
          value: "{path}"
          label: "{title}"
        description: Drag to reorder. New projects not in this list appear after it, newest first. Hidden projects are skipped.

  - name: press
    label: Press cards
    type: file
    path: _data/press.yml
    format: yaml
    list: true
    fields:
      - name: url
        label: Link
        type: string
        required: true
        description: Full https:// link, or a site page like /truly-destroyed/
      - name: label
        label: Label
        type: string
      - name: title
        label: Title
        type: string
      - name: image
        label: Image
        type: image
        options:
          media: images
      - name: width
        label: Image width (px)
        type: number
      - name: height
        label: Image height (px)
        type: number
      - name: logo
        label: Overlay logo
        type: image
        options:
          media: images
      - name: logo_width
        label: Logo width (px)
        type: number
      - name: logo_height
        label: Logo height (px)
        type: number
      - name: logo_alt
        label: Logo name
        type: string

  - name: settings
    label: Site settings
    type: file
    path: _data/settings.yml
    format: yaml
    fields:
      - name: home_title
        label: Home page browser tab title
        type: string
      - name: title_suffix
        label: Tab title suffix
        type: string
        description: Added after the project name in the browser tab, e.g. "GREENFORCE | Sako Tenz Portfolio".
      - name: description
        label: Site description (for Google / sharing)
        type: text
        description: Used by the home page, and by any page without its own description.
      - name: author
        label: Author name
        type: string
      - name: email
        label: Contact email
        type: string
        description: Shown in the footer and on the About page.
      - name: logo
        label: Logo text (top left)
        type: string
      - name: about_button
        label: About button (top right)
        type: string
      - name: tagline
        label: Tagline (band under the logo, home page)
        type: string
      - name: view_all
        label: Heading above the grid
        type: string
      - name: tags
        label: Tags (pills above the grid)
        type: string
        list: true
        description: Labels only, they are not clickable.
      - name: contact_label
        label: Footer contact text
        type: string
      - name: back_button
        label: Back button (bottom of project and About pages)
        type: string

  - name: about
    label: About page
    type: file
    path: _data/about.yml
    format: yaml
    fields:
      - name: page_title
        label: Browser tab title
        type: string
      - name: description
        label: Description (for Google / sharing)
        type: text
      - name: hero_image
        label: Top photo
        type: image
        options:
          media: images
      - name: hero_width
        label: Top photo width (px)
        type: number
      - name: hero_height
        label: Top photo height (px)
        type: number
      - name: hero_focus
        label: Face position in photo
        type: select
        default: upper
        description: The photo is cropped to a square on the left of the header. Pick where the face is.
        options:
          values:
            - name: top
              label: Top
            - name: upper
              label: Upper (default)
            - name: center
              label: Center
            - name: lower
              label: Lower
      - name: hero_name
        label: Name (next to the top photo)
        type: text
        description: One line per row.
      - name: bio
        label: Bio (under the name)
        type: text
        description: Short description. Leave an empty line between paragraphs. **bold** and *italic* work.
      - name: location
        label: Signature - location
        type: text
        description: Signature at the end of the text next to the photo. One line per row. The email under it is "Contact email" in Site settings.
      - name: linkedin
        label: Signature - LinkedIn link
        type: string
        description: Shown as a "LinkedIn" link. Leave empty to hide it.
      - name: experience_title
        label: Work experience heading
        type: string
      - name: experience
        label: Work experience
        type: object
        list: true
        fields:
          - name: when
            label: Dates and role
            type: string
          - name: where
            label: Company / place
            type: text
            description: One line per row.
      - name: trophy_image
        label: Side photo
        type: image
        options:
          media: images
      - name: trophy_width
        label: Side photo width (px)
        type: number
      - name: trophy_height
        label: Side photo height (px)
        type: number
      - name: trophy_caption
        label: Side photo caption
        type: string
      - name: awards_title
        label: Awards heading
        type: string
        description: Awards are listed under the bio, next to the photo.
      - name: awards
        label: Awards
        type: string
        list: true
      - name: other_awards_title
        label: Other awards heading
        type: string
      - name: other_awards
        label: Other awards
        type: string
        list: true
      - name: bottom_image
        label: Bottom photo
        type: image
        options:
          media: images
      - name: bottom_width
        label: Bottom photo width (px)
        type: number
      - name: bottom_height
        label: Bottom photo height (px)
        type: number
